name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # --locked installs exactly what uv.lock pins rather than re-resolving.
      # --all-extras because tests/test_app.py imports plotly, which lives in
      # the `app` extra; dev alone leaves it uncollectable.
      - name: Install
        run: uv sync --locked --all-extras

      # Uses the demo/fixture data committed in the repo. Verified locally:
      # 397 passed, 34 skipped.
      - name: Run tests
        run: uv run pytest -m "not network"
