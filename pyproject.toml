[project]
name = "setpiece"
version = "0.1.0"
description = "Corner-kick receiver and shot scoring, with defender adjustment search"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Oscar Dalton" }]
keywords = ["soccer", "set-piece", "corners", "graph-neural-network", "statsbomb"]

# Deliberately small. The loader uses urllib and json from the standard library,
# so there is no requests/pandas/pyarrow/pydantic/tqdm here; pandas and pyarrow
# still arrive transitively with streamlit under the `app` extra.
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "torch-geometric>=2.5",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.33",
    "plotly>=5.20",
    "streamlit-drawable-canvas>=0.9.3",
    "kaleido>=0.2.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
setpiece = "setpiece.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["setpiece"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: test requires network access (deselect with '-m \"not network\"')",
    "slow: test is slow",
]
